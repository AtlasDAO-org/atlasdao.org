<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas DAO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050505;
color:white;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),
url("hero.jpg");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
}

.content{
max-width:900px;
}

.logo{
width:170px;
margin-bottom:30px;
}

h1{
font-size:64px;
color:#f2c14e;
margin-bottom:20px;
}

h2{
font-size:26px;
margin-bottom:25px;
font-weight:normal;
}

p{
font-size:20px;
line-height:1.7;
margin-bottom:40px;
color:#ddd;
}

.buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
}

a.button{
padding:16px 34px;
border-radius:8px;
background:#d4af37;
color:#000;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

a.button:hover{
background:white;
}

.info{
background:#111;
padding:70px 20px;
text-align:center;
}

.info h3{
font-size:38px;
margin-bottom:25px;
color:#f2c14e;
}

.contract{
font-size:18px;
word-break:break-all;
margin-top:25px;
color:#ddd;
}
</style>

</head>

<body>

<section class="hero">

<div class="content">

<img src="logo.png" class="logo">

<h1>ATLAS DAO</h1>

<h2>Build • Invest • Grow • Together</h2>

<p>
Atlas DAO is a decentralized investment ecosystem built for long-term value, transparency, and shared success.
</p>

<div class="buttons">

<a class="button"
href="https://t.me/dao_atlas"
target="_blank">
Telegram
</a>

<a class="button"
href="https://github.com/AtlasDAO-org/atlasdao.org"
target="_blank">
GitHub
</a>

</div>

</div>

</section>

<section class="info">

<h3>ATC Token</h3>

<p>
Official utility token of the Atlas DAO ecosystem.
</p>

<div class="contract">

Contract:<br><br>

0x1fee92c11f4ec901b60c37d40b36e3a57fe8260c

</div>

</section>

</body>
</html>
